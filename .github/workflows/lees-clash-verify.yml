name: Lee's Clash Android regression
"on":
  workflow_dispatch:
    inputs:
      ref:
        description: 待验证分支或标签
        default: main
        required: true
        type: string
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/src/**'
      - 'gradle/**'
      - 'tools/release/**'
      - 'scripts/local-fixture.py'
      - '.github/workflows/lees-clash-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Prepare disposable runner disk
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 20 * 1024**3, "At least 20 GiB required before installing the locked SDK"'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Go SDK and Android SDK components
        run: |
          python3 -B tools/release/install_toolchain.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 'system-images;android-35;google_apis;x86_64'
      - name: Restore reusable build cache
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/go-build
            ~/go/pkg/mod
          key: clash-${{ runner.os }}-${{ hashFiles('tools/release/toolchain.json', '**/go.sum', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clash-${{ runner.os }}-${{ hashFiles('tools/release/toolchain.json', '**/go.sum', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-
            clash-${{ runner.os }}-
      - name: Build isolated Debug test packages
        run: bash gradlew :app:assembleAlphaDebug :app:assembleAlphaDebugAndroidTest -Pandroid.injected.build.abi=x86_64 '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --no-daemon --console=plain
      - name: Run complete isolated emulator regression
        run: |
          sudo chmod a+rw /dev/kvm
          bash tools/release/verify_android.sh debug
      - name: Save reusable cache even after test failure
        if: always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Report bounded verification logs
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'clash-verification'
          for path in sorted(folder.glob('*')):
              if path.is_file() and path.suffix in ('.txt', '.log'):
                  print(f'::group::{path.name}')
                  print('\n'.join(path.read_text(errors='replace').splitlines()[-250:]))
                  print('::endgroup::')
          PY
