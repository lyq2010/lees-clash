name: Lee's Clash release
"on":
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 私有源码版本标签，例如 v1.0.0（补丁号达到 50 时进位）
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lees-clash-release
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}
jobs:
  start-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run release on main for reusable cache scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run lees-clash-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Validate tag input
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require release source on main
        run: |
          git merge-base --is-ancestor "$TAG^{commit}" origin/main
      - name: Recognize immutable release for mirror retry
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release/published.py
      - name: Keep current runner verification tools
        if: steps.existing.outputs.published != 'true'
        run: |
          cp tools/release/verify_android.sh "$RUNNER_TEMP/lees-clash-verify-android.sh"
          cp tools/release/release_smoke.py "$RUNNER_TEMP/lees-clash-release-smoke.py"
      - name: Checkout release source
        if: steps.existing.outputs.published != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Test release helpers
        run: python3 -B -m unittest discover -s tools/release/tests -v
      - name: Prepare disposable runner disk
        if: steps.existing.outputs.published != 'true'
        run: |
          # These preinstalled tools are unused; reinstall only the locked Android components below.
          sudo rm -rf -- /usr/share/dotnet /usr/local/share/powershell "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          df -h "$GITHUB_WORKSPACE"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 20 * 1024**3, "At least 20 GiB required before installing the locked SDK"'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.existing.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Go SDK and Android SDK components
        if: steps.existing.outputs.published != 'true'
        run: |
          python3 -B tools/release/install_toolchain.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 'system-images;android-35;google_apis;x86_64'
      - name: Restore reusable build cache
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.existing.outputs.published != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/go-build
            ~/go/pkg/mod
          key: clash-${{ runner.os }}-${{ hashFiles('tools/release/toolchain.json', '**/go.sum', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clash-${{ runner.os }}-${{ hashFiles('tools/release/toolchain.json', '**/go.sum', '**/*.gradle.kts', 'gradle/libs.versions.toml') }}-
            clash-${{ runner.os }}-
      - name: Native unit tests
        if: steps.existing.outputs.published != 'true'
        working-directory: core/src/main/golang
        run: go test -v -tags=foss,with_gvisor,cmfa ./native/extension ./native/script ./native/diagnostics ./native/geoasset ./native/preview ./native/smart ./native/tunnel
      - name: Smart routing, failover and memory tests
        if: steps.existing.outputs.published != 'true'
        working-directory: core/src/foss/golang/clash
        run: go test -v -tags=foss,with_gvisor,cmfa -run Smart ./adapter/outboundgroup
      - name: Restore independent Clash signing
        if: steps.existing.outputs.published != 'true'
        env:
          LEES_CLASH_KEYSTORE_BASE64: ${{ secrets.LEES_CLASH_KEYSTORE_BASE64 }}
          LEES_CLASH_STORE_PASSWORD: ${{ secrets.LEES_CLASH_STORE_PASSWORD }}
          LEES_CLASH_KEY_PASSWORD: ${{ secrets.LEES_CLASH_KEY_PASSWORD }}
        run: python3 -B tools/release/signing.py
      - name: Test, lint and build the signed universal APK
        if: steps.existing.outputs.published != 'true'
        run: bash gradlew :app:testAlphaDebugUnitTest :app:lintAlphaRelease :app:assembleAlphaRelease '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --no-daemon --console=plain
      - name: Verify signed R8 runtime
        if: steps.existing.outputs.published != 'true'
        run: |
          sudo chmod a+rw /dev/kvm
            LEES_CLASH_RELEASE_SMOKE="$RUNNER_TEMP/lees-clash-release-smoke.py" bash "$RUNNER_TEMP/lees-clash-verify-android.sh" release
      - name: Verify identity, independent signing and stage artifacts
        if: steps.existing.outputs.published != 'true'
        run: |
          test -s app/build/outputs/mapping/alphaRelease/mapping.txt
          grep -q '^# compiler: R8' app/build/outputs/mapping/alphaRelease/mapping.txt
          python3 -B tools/release/audit_apk.py app/build/outputs/apk/alpha/release/*.apk
          python3 -B tools/release/stage.py "$TAG"
      - name: Publish immutable release assets
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(json.loads(Path("artifacts/release/latest-lees-clash.json").read_text())["notes"], encoding="utf-8")'
          gh release create "$TAG" artifacts/release/* --repo "$RELEASE_REPOSITORY" --target "$(git rev-parse HEAD)" --draft --latest=false --title "Lee's Clash ${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest=false
      - name: Save reusable cache even after test failure
        if: always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Remove ephemeral signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('signing.properties').unlink(missing_ok=True)
          (Path(os.environ['RUNNER_TEMP']) / 'lees-clash-release.p12').unlink(missing_ok=True)
          PY
      - name: Report bounded verification logs
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'clash-verification'
          for path in sorted(folder.glob('*')):
              if path.is_file() and path.suffix in ('.txt', '.log'):
                  print(f'::group::{path.name}')
                  print('\n'.join(path.read_text(errors='replace').splitlines()[-250:]))
                  print('::endgroup::')
          PY
  mirrors:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [cos, r2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Test cleanup boundaries
        run: python3 -B -m unittest discover -s tools/release/tests -v
      - name: Download verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$RELEASE_REPOSITORY" --dir assets
      - name: Install COS SDK
        if: matrix.channel == 'cos'
        run: |
          python3 -m venv "$RUNNER_TEMP/cos-venv"
          "$RUNNER_TEMP/cos-venv/bin/pip" install "cos-python-sdk-v5==$(python3 -c 'import json; print(json.load(open("tools/release/toolchain.json"))["cosSdk"])')"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.channel == 'r2'
        with:
          node-version: '22'
      - name: Upload, verify per channel, then remove only old Clash packages
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [ "$CHANNEL" = cos ]; then
            "$RUNNER_TEMP/cos-venv/bin/python" -B tools/release/mirror.py cos assets
          else
            python3 -B tools/release/mirror.py r2 assets
          fi
